    <style>

<body>

<div class="container">
    <h1>六合彩「1膽9腳」聰明組合計算機</h1>
    <p class="subtitle">自動套用 10 注覆蓋矩陣 (Smart Matrix)・生成 10 注保底組合</p>

    <div class="input-group">
        <div class="section-title">輸入 1 個膽 (Banker)</div>
        <div class="grid-1">
            <input type="number" id="banker" class="calc-input" min="1" max="49" placeholder="膽碼">
        </div>
    </div>

    <div class="input-group">
        <div class="section-title">輸入 9 個腳 (Legs)</div>
        <div class="grid-9">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
            <input type="number" class="leg-input calc-input" min="1" max="49">
        </div>
    </div>

    <button onclick="generateMatrix()" id="calc-btn">產生 10 注組合 (Generate 10 Bets)</button>
    <div id="error" class="error-msg"></div>

    <div id="result-container">
        <div class="section-title">你的專屬 10 注結果 (共 $100)</div>
        <div id="result-list"></div>
    </div>
</div>

<script>
    function getBallColor(num) {
        const red = [1, 2, 7, 8, 12, 13, 18, 19, 23, 24, 29, 30, 34, 35, 40, 45];
        const blue = [3, 4, 9, 10, 14, 15, 20, 25, 26, 31, 36, 37, 41, 42, 47, 48];
        const green = [5, 6, 11, 16, 17, 21, 22, 27, 28, 32, 33, 38, 39, 43, 44, 46, 49];
        
        if (red.includes(num)) return '#e74c3c';
        if (blue.includes(num)) return '#3498db';
        if (green.includes(num)) return '#2ecc71';
        return '#7f8c8d'; 
    }

    function generateMatrix() {
        const errorDiv = document.getElementById('error');
        const resultContainer = document.getElementById('result-container');
        const resultList = document.getElementById('result-list');
        
        errorDiv.innerText = '';
        resultList.innerHTML = '';
        resultContainer.style.display = 'none';

        const bankerVal = document.getElementById('banker').value;
        if (!bankerVal) {
            errorDiv.innerText = '請輸入 1 個膽碼！';
            return;
        }
        const banker = parseInt(bankerVal);

        const legInputs = document.querySelectorAll('.leg-input');
        let legs = [];
        for (let input of legInputs) {
            if (!input.value) {
                errorDiv.innerText = '請填滿 9 個腳碼！';
                return;
            }
            legs.push(parseInt(input.value));
        }

        const allNumbers = [banker, ...legs];
        const outOfRange = allNumbers.some(n => n < 1 || n > 49);
        if (outOfRange) {
            errorDiv.innerText = '號碼必須在 1 至 49 之間！';
            return;
        }

        const uniqueNumbers = new Set(allNumbers);
        if (uniqueNumbers.size !== 10) {
            errorDiv.innerText = '膽碼及腳碼不可有重複數字！';
            return;
        }

        legs.sort((a, b) => a - b);

        const matrixIndices = [
            [0, 1, 2, 3, 4], 
            [0, 1, 5, 6, 7], 
            [0, 2, 4, 6, 8], 
            [0, 3, 5, 7, 8], 
            [1, 2, 5, 7, 8], 
            [1, 3, 4, 6, 8], 
            [1, 3, 5, 6, 7], 
            [2, 3, 4, 5, 7], 
            [2, 4, 5, 6, 8], 
            [2, 3, 6, 7, 8]  
        ];

        matrixIndices.forEach((indices, index) => {
            let currentBet = [banker, ...indices.map(i => legs[i])];
            currentBet.sort((a, b) => a - b);

            const rowDiv = document.createElement('div');
            rowDiv.className = 'bet-row';
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'bet-number-label';
            labelDiv.innerText = `第 ${index + 1} 注`;
            rowDiv.appendChild(labelDiv);

            currentBet.forEach(num => {
                const ball = document.createElement('div');
                ball.className = 'ball';
                ball.style.backgroundColor = getBallColor(num);
                ball.innerText = num;
                if (num === banker) {
                    ball.classList.add('banker-highlight');
                    ball.title = '膽碼 (Banker)';
                }
                rowDiv.appendChild(ball);
            });

            resultList.appendChild(rowDiv);
        });

        resultContainer.style.display = 'block';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('.calc-input');
        inputs.forEach(input => {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); 
                    generateMatrix();   
                }
            });
        });
    });
</script>

</body>
